<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Aprobado por QA™ - Retro Game</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #121212; --accent: #f1c40f; --danger: #e74c3c; --success: #2ecc71; }
        body { background: var(--bg); color: #fff; font-family: 'Press Start 2P', cursive; font-size: 10px; display: flex; flex-direction: column; align-items: center; margin: 0; }
        
        /* Portada con dado animado */
        #home-screen { position: fixed; inset: 0; background: #000; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .pixel-dice { width: 50px; height: 50px; background: white; border: 4px solid #000; margin-bottom: 20px; animation: bounce 1.5s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* Estilos del Tablero */
        #game-board { display: none; margin-top: 20px; }
        .board-grid { display: grid; grid-template-columns: repeat(7, 90px); grid-template-rows: repeat(7, 90px); gap: 4px; background: #333; padding: 10px; border: 8px solid #000; position: relative; }
        .cell { background: #95a5a6; border: 2px solid #000; color: #000; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 7px; font-weight: bold; }
        .center { grid-column: 2 / 7; grid-row: 2 / 7; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .player { width: 20px; height: 20px; position: absolute; z-index: 100; border: 2px solid #000; transition: 0.6s; display: flex; align-items: center; justify-content: center; color: #000; }
        
        button { font-family: 'Press Start 2P'; padding: 12px; cursor: pointer; border: 4px outset #f39c12; background: var(--accent); margin: 5px; font-size: 8px; }
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 8000; justify-content: center; align-items: center; }
        .modal-content { background: #ecf0f1; color: #2c3e50; padding: 30px; border: 8px solid #000; width: 450px; text-align: center; }
        textarea { width: 90%; height: 60px; font-family: 'Press Start 2P'; font-size: 8px; margin: 10px 0; }
    </style>
</head>
<body>

    <div id="home-screen">
        <div class="pixel-dice"></div>
        <h1 style="color: var(--accent);">APROBADO POR QA™</h1>
        <p style="max-width: 500px; line-height: 1.8;">Bloqueados. Bugs. Cambios inesperados.<br>¿Puede el equipo sobrevivir 2 vueltas?</p>
        <button onclick="joinGame()">UNIRSE AL SPRINT</button>
    </div>

    <div id="game-board">
        <div id="stats" style="margin-bottom: 10px;">
            STB: <span id="stb-val">100</span>% | QA✓: <span id="qa-val">0</span> | Turno: <span id="current-dev">---</span>
        </div>
        <div class="board-grid" id="grid">
            <div class="center">
                <button id="roll-btn" onclick="socket.emit('roll_dice')">TIRAR DADO</button>
                <div id="dice-res" style="font-size: 24px;"></div>
            </div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h3 id="m-title"></h3>
            <p id="m-question" style="font-size: 8px;"></p>
            <div id="ans-box">
                <textarea id="resp-text"></textarea><br>
                <button onclick="confirmAnswer()">CONFIRMAR RESPUESTA</button>
            </div>
            <div id="vote-box" style="display:none;">
                <p>¿ESTA RESPUESTA AYUDA AL SPRINT?</p>
                <button onclick="vote(true)" style="background:var(--success)">SI</button>
                <button onclick="vote(false)" style="background:var(--danger)">NO</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io("https://aprobado-por-qa.onrender.com");
        let myId, gameState;

        function joinGame() {
            const name = prompt("Tu nombre/rol:");
            if(name) {
                socket.emit("join_game", name);
                document.getElementById('home-screen').style.display = 'none';
                document.getElementById('game-board').style.display = 'block';
            }
        }

        socket.on("update", (state) => {
            gameState = state;
            document.getElementById('stb-val').innerText = state.stability;
            document.getElementById('qa-val').innerText = state.qaApprovals;
            const curP = state.players[state.currentIdx];
            document.getElementById('current-dev').innerText = curP ? curP.name : "---";
            
            // Renderizar fichas
            // (Aquí va la lógica de movimiento que sincroniza posiciones)
            if(state.waitingForVote && curP) {
                showModal(curP, state);
            }
        });

        // ... Resto de lógica de UI ...
    </script>
</body>
</html>
